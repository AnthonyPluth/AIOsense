# https://esphome.io/components/debug.html
# Optional: exposes device diagnostics (free heap, loop time, reset reason, ...)

debug:
  update_interval: 60s

text_sensor:
  - platform: debug
    device:
      name: "Device Info"
    reset_reason:
      name: "Reset Reason"

sensor:
  - platform: debug
    free:
      name: "Heap Free"
    loop_time:
      name: "Loop Time"
