substitutions:
  version: "3.0.1"

esphome:
  name: "${name}"
  friendly_name: "${friendly_name}"

  min_version: 2026.9.0

  project:
    name: "Schluggi.AIOsense"
    version: "${version}"

logger:
  baud_rate: 0  # disable logging via UART

i2c:
  scan: true

wifi:
  # Fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "${name}"

button:
  - platform: restart
    name: "Restart"
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
    device_class: connectivity
    entity_category: diagnostic

sensor:
  - platform: wifi_signal
    name: "Wifi Signal"
    device_class: signal_strength
    entity_category: diagnostic
