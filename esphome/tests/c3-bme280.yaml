# CI test config: validates package combinations with 'esphome config'
substitutions:
  name: ci-c3-bme280
  friendly_name: CI c3-bme280

packages:
  base: !include ../packages/config/base.yaml
  board: !include ../packages/config/esp32-c3-mini.yaml
  bh1750: !include ../packages/sensors/bh1750.yaml
  bme280: !include ../packages/sensors/bme280.yaml
  buzzer: !include ../packages/sensors/buzzer.yaml
  pir: !include ../packages/sensors/pir.yaml
  rgb_led: !include ../packages/sensors/rgb_led.yaml
  ld2410: !include ../packages/sensors/ld2410.yaml
  occupancy: !include ../packages/sensors/occupancy.yaml
  debug: !include ../packages/sensors/debug.yaml

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
