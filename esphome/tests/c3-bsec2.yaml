# CI test config: validates package combinations with 'esphome config'
substitutions:
  name: ci-c3-bsec2
  friendly_name: CI c3-bsec2

packages:
  base: !include ../packages/config/base.yaml
  board: !include ../packages/config/esp32-c3-mini.yaml
  bme68x_bsec2: !include ../packages/sensors/bme68x_bsec2.yaml
  bh1750: !include ../packages/sensors/bh1750.yaml
  rgb_led: !include ../packages/sensors/rgb_led.yaml
  ld2450: !include ../packages/sensors/ld2450.yaml

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
