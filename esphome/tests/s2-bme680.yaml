# CI test config: validates package combinations with 'esphome config'
substitutions:
  name: ci-s2-bme680
  friendly_name: CI s2-bme680

packages:
  base: !include ../packages/config/base.yaml
  board: !include ../packages/config/esp32-s2-mini.yaml
  bh1750: !include ../packages/sensors/bh1750.yaml
  bme68x: !include ../packages/sensors/bme68x.yaml
  display: !include ../packages/sensors/display.yaml
  pir: !include ../packages/sensors/pir.yaml
  led: !include ../packages/sensors/led.yaml
  sen0395: !include ../packages/sensors/sen0395.yaml

api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
